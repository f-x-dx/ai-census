<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Census — a discovery instrument for AI transformation">
  <!-- Integral Studio · System A (Tracker, terminal-grade). Sharp corners, 1px hairlines, one accent moment. -->
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03FFAA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#03FFAA" stop-opacity="0.14"/>
      <stop offset="0.98" stop-color="#03FFAA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#03FFAA" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .wide { font-family: "Roc Grotesk Wide", "Arial Black", ui-sans-serif, sans-serif; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="380" fill="#0A0A0A"/>

  <!-- hairline grid -->
  <g stroke="#14141A" stroke-width="1">
    <path d="M0 95.5H1200 M0 190.5H1200 M0 285.5H1200"/>
    <path d="M300.5 0V380 M600.5 0V380 M900.5 0V380"/>
  </g>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none" stroke="#262630"/>

  <!-- ================= left: title block ================= -->
  <text x="64" y="84" class="mono" font-size="12" letter-spacing="3" fill="#7B7B8A">INTEGRAL STUDIO · DISCOVERY INSTRUMENT</text>

  <text x="60" y="150" class="wide" font-size="58" font-weight="900" letter-spacing="10" fill="#FFFFFF">AI CENSUS</text>

  <text x="64" y="188" class="mono" font-size="15" fill="#A0A0AE">You cannot transform what you cannot see.</text>

  <!-- terminal line -->
  <rect x="64" y="216" width="472" height="44" fill="#050505" stroke="#262630"/>
  <text x="82" y="243" class="mono" font-size="14" fill="#03FFAA">$</text>
  <text x="98" y="243" class="mono" font-size="14" fill="#E8E8EE">census run</text>
  <rect x="196" y="230" width="8" height="16" fill="#03FFAA"/>

  <!-- bucket chips -->
  <g class="mono" font-size="11" letter-spacing="2">
    <rect x="64" y="292" width="104" height="30" fill="none" stroke="#262630"/>
    <rect x="76" y="303" width="8" height="8" fill="#03FFAA"/>
    <text x="92" y="312" fill="#C8C8D2">SCALE</text>

    <rect x="176" y="292" width="104" height="30" fill="none" stroke="#262630"/>
    <rect x="188" y="303" width="8" height="8" fill="#FFB020"/>
    <text x="204" y="312" fill="#C8C8D2">MERGE</text>

    <rect x="288" y="292" width="110" height="30" fill="none" stroke="#262630"/>
    <rect x="300" y="303" width="8" height="8" fill="#FF4757"/>
    <text x="316" y="312" fill="#C8C8D2">SUNSET</text>

    <rect x="406" y="292" width="104" height="30" fill="none" stroke="#262630"/>
    <rect x="418" y="303" width="8" height="8" fill="#A78BFA"/>
    <text x="434" y="312" fill="#C8C8D2">BUILD</text>
  </g>

  <!-- ================= right: the census graph ================= -->
  <!-- edges (hairlines) -->
  <g stroke="#262630" stroke-width="1">
    <path d="M760 120 L860 88 M760 120 L840 180 M860 88 L940 140 M840 180 L940 140
             M840 180 L790 250 M940 140 L1030 100 M940 140 L1010 210 M1030 100 L1108 150
             M1010 210 L1108 150 M1010 210 L950 290 M790 250 L870 300 M950 290 L870 300
             M1010 210 L1084 268 M700 190 L760 120 M700 190 L790 250"/>
  </g>
  <!-- duplicate-pattern ring (dashed) around the MERGE cluster -->
  <circle cx="878" cy="292" r="46" fill="none" stroke="#FFB020" stroke-opacity="0.5" stroke-dasharray="4 5"/>

  <!-- nodes: verdicts as color -->
  <g>
    <circle cx="760" cy="120" r="9"  fill="#03FFAA"/>
    <circle cx="940" cy="140" r="12" fill="#03FFAA"/>
    <circle cx="1030" cy="100" r="7" fill="#03FFAA"/>
    <circle cx="700" cy="190" r="6"  fill="#A78BFA"/>
    <circle cx="860" cy="88"  r="6"  fill="#FF4757"/>
    <circle cx="1108" cy="150" r="8" fill="#FF4757"/>
    <circle cx="840" cy="180" r="8"  fill="#FFB020"/>
    <circle cx="790" cy="250" r="7"  fill="#FFB020"/>
    <circle cx="870" cy="300" r="8"  fill="#FFB020"/>
    <circle cx="950" cy="290" r="6"  fill="#FFB020"/>
    <circle cx="1010" cy="210" r="10" fill="#03FFAA"/>
    <circle cx="1084" cy="268" r="6" fill="#565666"/>
  </g>

  <!-- node labels (sparse, terminal-grade) -->
  <g class="mono" font-size="10" fill="#7B7B8A">
    <text x="958" y="132">shipped · 40 users</text>
    <text x="806" y="354">same tool · 4 builds</text>
    <text x="1122" y="154">idle seats</text>
  </g>

  <!-- the scan: one accent moment -->
  <rect x="620" y="1" width="130" height="378" fill="url(#scan)"/>
  <path d="M750.5 1V379" stroke="#03FFAA" stroke-width="1"/>
  <text x="742" y="30" class="mono" font-size="10" letter-spacing="2" fill="#03FFAA" text-anchor="end">SCANNING</text>

  <!-- footer coordinates -->
  <text x="1136" y="356" class="mono" font-size="10" letter-spacing="2" fill="#3A3A48" text-anchor="end">EVIDENCE FIRST · RUNS IN YOUR WALLS</text>
</svg>
